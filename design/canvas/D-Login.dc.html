<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lort/tokens.css">
<link rel="stylesheet" href="ds/lort/components/bundle.css">
<script src="ds/lort/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.lg-label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.lg-field{all:unset;box-sizing:border-box;display:block;width:100%;height:46px;padding:0 18px;border-radius:999px;background:var(--ground);border:1px solid var(--border);font-size:15px;color:var(--ink)}
.lg-field:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</helmet>
<div data-theme="dark" style="min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); padding: 40px 16px; box-sizing: border-box">
  <form style="width: 400px; max-width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 32px 30px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; margin-bottom: 4px">
      <span style="width: 52px; height: 52px; border-radius: 14px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; transform: rotate(var(--tilt-mark)); box-shadow: var(--shadow-sticker)">D</span>
      <div>
        <h1 class="title" style="margin: 0; font-size: 24px; line-height: 30px">Driftnote dashboard</h1>
        <p style="margin: 6px 0 0; font-size: 14px; color: var(--muted)">For the Driftnote team. Looking for the board? <a href="#" style="color: var(--primary-text); font-weight: 600">Go to feedback</a></p>
      </div>
    </div>
    <div><label class="lg-label" for="lg-e">Email</label><input id="lg-e" class="lg-field" type="email" value="luk@driftnote.app" autocomplete="username"></div>
    <div><label class="lg-label" for="lg-p">Password</label><input id="lg-p" class="lg-field" type="password" value="hunter2hunter2" autocomplete="current-password"></div>
    <x-import component-from-global-scope="Lort.Button" variant="primary" type="submit" style="width: 100%">Sign in</x-import>
    <p style="margin: 2px 0 0; font-size: 13px; line-height: 19px; color: var(--muted); text-align: center">Forgot it? On the server, run<br><code style="font-family: 'JetBrains Mono', monospace; font-size: 12px; background: var(--surface-2); color: var(--ink); padding: 2px 7px; border-radius: 6px">./setup.sh --reset-admin</code></p>
  </form>
  <a href="#" style="font-size: 13px; color: var(--muted)">Powered by <b style="color: var(--ink)">Lort</b></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
