<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Request page loading</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lort/tokens.css">
<link rel="stylesheet" href="ds/lort/components/bundle.css">
<script src="ds/lort/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.side-item{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:600;color:var(--muted)}
.side-item.on{background:var(--surface-2);color:var(--ink)}
.sk{background:var(--surface-2);border-radius:999px;animation:sk-pulse 1.6s ease-in-out infinite}
@keyframes sk-pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.sk-row{display:flex;align-items:center;gap:12px;padding-left:4px}
</style>
</helmet>
<div data-theme="dark" aria-busy="true" style="position: relative; height: 1040px; overflow: hidden; display: flex; background: var(--ground); color: var(--ink); font-family: var(--font-sans)">
  <aside aria-label="Dashboard" style="width: 244px; flex: none; padding: 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; background: var(--ground-sunken); border-right: 1px solid var(--surface-2)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px">
      <span style="width: 30px; height: 30px; border-radius: var(--radius-sm); background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; transform: rotate(var(--tilt-mark)); box-shadow: var(--shadow-sticker)">D</span>
      <span style="font-family: var(--font-display); font-weight: 800; font-size: 17px; flex: 1">Driftnote</span>
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM9 4v16M15 10l-2 2l2 2"></path></svg></span>
    </div>
    <a class="side-item on" href="#" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 13h3l3 3h4l3-3h3"></path></svg>Requests</a>
    <a class="side-item" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6M14 4h6M4 10a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM14 10a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"></path></svg>Roadmap</a>
    <a class="side-item" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 6h3a1 1 0 0 1 1 1v11a2 2 0 0 1-4 0V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a3 3 0 0 0 3 3h11M8 8h4M8 12h4M8 16h4"></path></svg>Changelog</a>
    <div style="flex: 1"></div>
    <a class="side-item" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0M3 6v13M12 6v13M21 6v13"></path></svg>Docs</a>
    <a class="side-item" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6a2 2 0 1 0 4 0a2 2 0 1 0-4 0M4 6h8M16 6h4M6 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0M4 12h2M10 12h10M15 18a2 2 0 1 0 4 0a2 2 0 1 0-4 0M4 18h11M19 18h1"></path></svg>Settings</a>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 8px 2px">
      <x-import component-from-global-scope="Lort.Avatar" name="Luk" size="{{28}}" team="{{true}}"></x-import>
      <span style="font-size: 13px; font-weight: 600; flex: 1">Luk</span>
      <span style="font-size: 11px; color: var(--muted)">Lort 1.0</span>
    </div>
  </aside>

  <main style="flex: 1; min-width: 0; padding: 30px 40px 0; box-sizing: border-box">
    <div style="max-width: 820px; margin: 0 auto">
      <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 22px">
        <a href="#">Requests</a><span>/</span><div class="sk" style="width: 48px; height: 12px"></div>
        <span style="flex: 1"></span>
        <div class="sk" style="width: 120px; height: 12px"></div>
      </nav>

      <div style="display: flex; gap: 24px; align-items: flex-start">
        <div style="flex: 1; min-width: 0">
          <div class="sk" style="width: 92%; height: 34px; border-radius: 12px"></div>
          <div class="sk" style="width: 58%; height: 34px; border-radius: 12px; margin-top: 10px"></div>
          <div style="display: flex; align-items: center; gap: 10px; margin-top: 16px">
            <div class="sk" style="width: 32px; height: 32px"></div>
            <div class="sk" style="width: 150px; height: 13px"></div>
          </div>
        </div>
        <div class="sk" style="width: 58px; height: 58px; flex: none"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
        <div class="sk" style="width: 96%; height: 14px"></div>
        <div class="sk" style="width: 90%; height: 14px"></div>
        <div class="sk" style="width: 54%; height: 14px"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-top: 22px">
        <div class="sk" style="width: 108px; height: 32px"></div>
        <div class="sk" style="width: 64px; height: 32px"></div>
        <div class="sk" style="width: 76px; height: 32px"></div>
        <div class="sk" style="width: 58px; height: 32px"></div>
        <div class="sk" style="width: 32px; height: 32px"></div>
      </div>

      <div style="height: 1px; background: var(--border); margin: 28px 0 22px"></div>

      <x-import component-from-global-scope="Lort.Composer" placeholder="Write a reply or a note for the team…" can-use-internal="{{true}}" allow-images="{{true}}" voice-enabled="{{true}}" hint-size="100%,130px"></x-import>

      <section aria-label="Activity" style="margin-top: 28px; display: flex; flex-direction: column; gap: 22px">
        <div class="sk-row"><div class="sk" style="width: 20px; height: 20px"></div><div class="sk" style="width: 280px; height: 12px"></div></div>
        <div style="padding: 14px 16px; background: var(--surface); border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 8px"><div class="sk" style="width: 26px; height: 26px; background: var(--surface-3)"></div><div class="sk" style="width: 110px; height: 12px; background: var(--surface-3)"></div></div>
          <div class="sk" style="width: 88%; height: 13px; margin-left: 34px; background: var(--surface-3)"></div>
          <div class="sk" style="width: 46%; height: 13px; margin-left: 34px; background: var(--surface-3)"></div>
        </div>
        <div style="padding: 0 4px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 8px"><div class="sk" style="width: 26px; height: 26px"></div><div class="sk" style="width: 96px; height: 12px"></div></div>
          <div class="sk" style="width: 62%; height: 13px; margin-left: 34px"></div>
        </div>
        <div class="sk-row"><div class="sk" style="width: 20px; height: 20px"></div><div class="sk" style="width: 230px; height: 12px"></div></div>
      </section>
    </div>
  </main>

  <div style="position: absolute; z-index: 20; left: 244px; right: 0; bottom: 28px; display: flex; justify-content: center">
    <div class="sk" style="width: 470px; height: 56px; box-shadow: var(--shadow-inset-sm)"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
