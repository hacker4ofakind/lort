<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback board on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lort/tokens.css">
<link rel="stylesheet" href="ds/lort/components/bundle.css">
<script src="ds/lort/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.ph .lt-card{padding:16px;gap:14px}
.ph .lt-card-title{font-size:17px;line-height:22px}
.ph .lt-card-body{font-size:14px;line-height:21px}
.ph .lt-meta{gap:8px 12px}
</style>
</helmet>
<div class="ph" data-theme="dark" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-sans)">
  <div style="height: 100%; overflow-y: auto; padding-bottom: 120px; box-sizing: border-box">
    <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px">
      <span style="width: 30px; height: 30px; border-radius: var(--radius-sm); background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; transform: rotate(var(--tilt-mark)); box-shadow: var(--shadow-sticker)">D</span>
      <span style="font-family: var(--font-display); font-weight: 800; font-size: 18px; flex: 1">Driftnote</span>
      <x-import component-from-global-scope="Lort.Button" variant="ghost" icon="search" icon-only="{{true}}" aria-label="Search"></x-import>
      <x-import component-from-global-scope="Lort.Avatar" name="Luk" size="{{34}}" keyline="{{true}}"></x-import>
    </header>
    <nav aria-label="Board" style="display: flex; gap: 4px; padding: 0 12px 6px">
      <a href="#" aria-current="page" style="font-size: 14px; font-weight: 600; padding: 7px 13px; border-radius: 999px; background: var(--surface-2)">Feedback</a>
      <a href="#" style="font-size: 14px; font-weight: 600; padding: 7px 13px; border-radius: 999px; color: var(--muted)">Roadmap</a>
      <a href="#" style="font-size: 14px; font-weight: 600; padding: 7px 13px; border-radius: 999px; color: var(--muted)">Changelog</a>
    </nav>
    <div style="padding: 14px 16px 0">
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 34px; letter-spacing: -0.03em">Got an idea for Driftnote?</h1>
      <p style="margin: 8px 0 18px; font-size: 15px; line-height: 22px; color: var(--ink-2)">Stick a dot on the ones you want most.</p>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{requests}}" as="r" hint-placeholder-count="4">
          <x-import component-from-global-scope="Lort.RequestCard" request="{{r}}" href="#" hint-size="100%,170px"></x-import>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center">
    <x-import component-from-global-scope="Lort.FloatingBar" boards="{{boards}}" compact="{{true}}" hint-size="290px,64px"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      boards: ['Features', 'Bugs'],
      requests: [
        { title: 'Dark mode for the editor', body: 'Writing at night is rough on the eyes. A proper dark theme for the editor and the entry list would make Driftnote my go-to before bed.', status: 'planned', board: 'Features', author: { name: 'Mara K.' }, comments: 9, votes: 48, voted: true },
        { title: 'Export every entry as Markdown', body: 'One click to download everything as .md files with the date and tags in front-matter.', status: 'progress', board: 'Features', author: { name: 'devon' }, comments: 5, votes: 36, voted: false },
        { title: 'Sync drops my newest entry after a day offline', body: 'If the app has been offline for more than about 24 hours, the first sync shows a conflict and the most recent entry disappears.', status: 'reviewing', board: 'Bugs', author: { name: 'Priya S.' }, comments: 4, votes: 21, voted: false },
        { title: 'Home-screen widget with today’s prompt', body: 'A small widget that shows the daily writing prompt and opens a new entry when tapped.', status: 'pending', board: 'Features', author: { name: 'jonas' }, comments: 2, votes: 14, voted: false }
      ]
    };
  }
}
</script>
</body>
</html>
