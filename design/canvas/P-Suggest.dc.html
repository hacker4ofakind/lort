<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suggest something modal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lort/tokens.css">
<link rel="stylesheet" href="ds/lort/components/bundle.css">
<script src="ds/lort/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.sg-field{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px 16px;border-radius:14px;background:var(--ground);border:1px solid var(--border);font-family:var(--font-sans);font-size:15px;line-height:23px;color:var(--ink)}
.sg-field:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sg-field::placeholder{color:var(--muted)}
.sg-label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.sg-tag{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.sg-tag[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-text);box-shadow:inset 0 0 0 1.5px var(--primary-text)}
.sg-tag:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sg-compose .lt-composer:not(.is-internal){background:var(--surface-2);border-color:var(--border-strong);--lt-si-ground:var(--surface-2)}
.sg-compose .lt-composer:not(.is-internal) .lt-visibility:hover,.sg-compose .lt-composer:not(.is-internal) .lt-btn-ghost:hover:not(:disabled){background:var(--surface-3)}
</style>
</helmet>
<div data-theme="dark" style="position: relative; height: 1040px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-sans)">
  <div aria-hidden="true" style="max-width: 860px; margin: 0 auto; padding: 112px 32px 0; display: flex; flex-direction: column; gap: 12px">
    <div class="display-xl" style="margin-bottom: 20px">Got an idea for Driftnote?</div>
    <sc-for list="{{background}}" as="r" hint-placeholder-count="4">
      <x-import component-from-global-scope="Lort.RequestCard" request="{{r}}" href="#" hint-size="100%,150px"></x-import>
    </sc-for>
  </div>

  <div style="position: absolute; inset: 0; z-index: 10; background: rgba(12, 10, 9, 0.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-start; justify-content: center; padding-top: 72px">
    <div role="dialog" aria-modal="true" aria-labelledby="sg-title" style="width: 640px; max-width: calc(100% - 32px); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-xl); box-shadow: var(--shadow-float); padding: 24px 26px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; align-items: center; gap: 12px">
        <h2 id="sg-title" class="title" style="margin: 0; flex: 1">Suggest something</h2>
        <x-import component-from-global-scope="Lort.Button" variant="ghost" icon="x" icon-only="{{true}}" aria-label="Close"></x-import>
      </div>

      <div>
        <span class="sg-label" id="sg-board">Board</span>
        <div role="radiogroup" aria-labelledby="sg-board" style="display: inline-flex; padding: 4px; border-radius: 999px; background: var(--ground); border: 1px solid var(--border); box-shadow: var(--shadow-inset-sm)">
          <button type="button" role="radio" aria-checked="true" style="all: unset; cursor: pointer; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--ink); color: var(--ground); font-size: 14px; font-weight: 600; display: flex; align-items: center">Features</button>
          <button type="button" role="radio" aria-checked="false" style="all: unset; cursor: pointer; height: 34px; padding: 0 16px; border-radius: 999px; color: var(--muted); font-size: 14px; font-weight: 600; display: flex; align-items: center">Bugs</button>
        </div>
      </div>

      <div>
        <label class="sg-label" for="sg-t">Title</label>
        <input id="sg-t" class="sg-field" value="Dark theme for writing at night" style="font-family: var(--font-display); font-size: 18px; font-weight: 700">
        <div style="margin-top: 10px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface-2); --lt-si-ground: var(--surface-2)">
          <div style="font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px">Is it one of these? A dot counts the same as a new post.</div>
          <sc-for list="{{similar}}" as="s" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0">
              <x-import component-from-global-scope="Lort.VoteSticker" count="{{s.votes}}" default-voted="{{s.voted}}" size="sm" subject="{{s.title}}"></x-import>
              <div style="flex: 1; min-width: 0">
                <div style="font-weight: 600; font-size: 15px">{{s.title}}</div>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 13px; color: var(--muted)">
                  <x-import component-from-global-scope="Lort.StatusIcon" status="{{s.status}}" show-label="{{true}}" size="{{14}}"></x-import>· {{s.board}}
                </div>
              </div>
              <a href="#" style="font-size: 13px; font-weight: 600; color: var(--primary-text)">Open</a>
            </div>
          </sc-for>
        </div>
      </div>

      <div>
        <span class="sg-label">Tags <span style="font-weight: 500; color: var(--muted)">(optional)</span></span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" class="sg-tag" aria-pressed="true">editor</button>
          <button type="button" class="sg-tag" aria-pressed="false">ui</button>
          <button type="button" class="sg-tag" aria-pressed="false">ios</button>
          <button type="button" class="sg-tag" aria-pressed="false">android</button>
          <button type="button" class="sg-tag" aria-pressed="false">sync</button>
        </div>
      </div>

      <div class="sg-compose">
        <span class="sg-label">Details</span>
        <x-import component-from-global-scope="Lort.Composer" placeholder="What would it help you do? Screenshots and voice notes welcome." allow-images="{{true}}" voice-enabled="{{true}}" can-use-internal="{{viewerIsAdmin}}" hint-size="100%,130px"></x-import>      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"viewerIsAdmin":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      viewerIsAdmin: this.props.viewerIsAdmin ?? true,
      similar: [
        { title: 'Dark mode for the editor', status: 'planned', board: 'Features', votes: 48, voted: false },
        { title: 'Night shift: warmer colours after sunset', status: 'pending', board: 'Features', votes: 6, voted: false }
      ],
      background: [
        { title: 'Dark mode for the editor', body: 'Writing at night is rough on the eyes. A proper dark theme for the editor and the entry list would make Driftnote my go-to before bed.', status: 'planned', board: 'Features', author: { name: 'Mara K.' }, comments: 9, votes: 48, voted: false },
        { title: 'Export every entry as Markdown', body: 'One click to download everything as .md files with the date and tags in front-matter, so I can keep a backup in Obsidian.', status: 'progress', board: 'Features', author: { name: 'devon' }, comments: 5, votes: 36, voted: true },
        { title: 'Sync drops my newest entry after a day offline', body: 'If the app has been offline for more than about 24 hours, the first sync shows a conflict and the most recent entry disappears.', status: 'reviewing', board: 'Bugs', author: { name: 'Priya S.' }, comments: 4, votes: 21, voted: false },
        { title: 'Home-screen widget with today’s prompt', body: 'A small widget that shows the daily writing prompt and opens a new entry when tapped.', status: 'pending', board: 'Features', author: { name: 'jonas' }, comments: 2, votes: 14, voted: false },
        { title: 'Weekly email with my writing streak', body: 'A Sunday email: how many days I wrote, total words, and one entry from a year ago.', status: 'pending', board: 'Features', author: { name: 'sam_w' }, comments: 1, votes: 7, voted: false }
      ]
    };
  }
}
</script>
</body>
</html>
