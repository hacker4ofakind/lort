<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Public feedback board (light)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lort/tokens.css">
<link rel="stylesheet" href="ds/lort/components/bundle.css">
<script src="ds/lort/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div data-theme="light" style="min-height: 1600px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); padding-bottom: 160px; box-sizing: border-box">
  <header style="max-width: 1120px; margin: 0 auto; padding: 0 32px; height: 76px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap">
    <a href="#" style="display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 19px">
      <span style="width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 16px; transform: rotate(var(--tilt-mark)); box-shadow: var(--shadow-sticker)">D</span>Driftnote
    </a>
    <nav aria-label="Board" style="display: flex; gap: 4px; margin-left: 10px">
      <a href="#" aria-current="page" style="font-size: 15px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-pill); background: var(--surface-2)">Feedback</a>
      <a href="#" style="font-size: 15px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-pill); color: var(--muted)">Roadmap</a>
      <a href="#" style="font-size: 15px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-pill); color: var(--muted)">Changelog</a>
    </nav>
    <div style="flex: 1"></div>
    <label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border); color: var(--muted); width: 240px; box-sizing: border-box">
      <x-import component-from-global-scope="Lort.Icon" name="search" size="{{16}}"></x-import>
      <input type="search" placeholder="Search ideas" aria-label="Search ideas" style="all: unset; flex: 1; font-size: 14px; color: var(--ink)">
    </label>
    <button aria-label="Your account" style="all: unset; cursor: pointer; border-radius: 50%">
      <x-import component-from-global-scope="Lort.Avatar" name="Luk" size="{{38}}" keyline="{{true}}"></x-import>
    </button>
  </header>

  <main style="max-width: 860px; margin: 0 auto; padding: 36px 32px 0; box-sizing: border-box">
    <h1 class="display-xl" style="margin: 0; text-wrap: balance">Got an idea for Driftnote?</h1>
    <p class="body-lg" style="margin: 12px 0 30px; color: var(--ink-2); max-width: 60ch">Stick a dot on the ones you want most. The team builds what gets the most dots, and tells you when it ships.</p>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{requests}}" as="r" hint-placeholder-count="6">
        <x-import component-from-global-scope="Lort.RequestCard" request="{{r}}" href="#" hint-size="100%,150px"></x-import>
      </sc-for>
    </div>

    <footer style="margin-top: 56px; display: flex; justify-content: center">
      <a href="#" style="font-size: 13px; color: var(--muted)">Powered by <b style="color: var(--ink)">Lort</b></a>
    </footer>
  </main>

  <div style="position: fixed; z-index: 20; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center; padding: 0 16px; pointer-events: none">
    <div style="pointer-events: auto">
      <x-import component-from-global-scope="Lort.FloatingBar" boards="{{boards}}" hint-size="640px,58px"></x-import>
    </div>
  </div>

  <a href="#" style="position: fixed; z-index: 21; left: 24px; bottom: 34px; display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-inset-sm), var(--shadow-card-float)">
    <span style="width: 26px; height: 26px; border-radius: 50%; background: var(--status-pending); border: 2px solid var(--keyline); box-sizing: border-box; transform: rotate(8deg)"></span>Get your own board like this
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      boards: ['Features', 'Bugs'],
      requests: [
        { title: 'Lock the app with Face ID', body: 'Some of my entries are personal. An optional Face ID or passcode lock when the app opens would make me feel a lot better.', status: 'pending', board: 'Features', author: { name: 'Luk' }, comments: 0, votes: 1, voted: true, awaitingApproval: true },
        { title: 'Dark mode for the editor', body: 'Writing at night is rough on the eyes. A proper dark theme for the editor and the entry list would make Driftnote my go-to before bed.', status: 'planned', board: 'Features', author: { name: 'Mara K.' }, comments: 9, votes: 48, voted: true },
        { title: 'Export every entry as Markdown', body: 'One click to download everything as .md files with the date and tags in front-matter, so I can keep a backup in Obsidian.', status: 'progress', board: 'Features', author: { name: 'devon' }, comments: 5, votes: 36, voted: true },
        { title: 'Sync drops my newest entry after a day offline', body: 'If the app has been offline for more than about 24 hours, the first sync shows a conflict and the most recent entry disappears. Android 15, app 2.3.1.', status: 'reviewing', board: 'Bugs', author: { name: 'Priya S.' }, comments: 4, votes: 21, voted: false },
        { title: 'Home-screen widget with today’s prompt', body: 'A small widget that shows the daily writing prompt and opens a new entry when tapped.', status: 'pending', board: 'Features', author: { name: 'jonas' }, comments: 2, votes: 14, voted: false },
        { title: 'Calendar heatmap of my writing streak', body: 'A GitHub-style grid of the last year, one square per day, darker when I wrote more. Tapping a day opens that entry.', status: 'planned', board: 'Features', author: { name: 'Ezra' }, comments: 3, votes: 22, voted: false },
        { title: 'Weekly email with my writing streak', body: 'A Sunday email: how many days I wrote, total words, and one entry from a year ago.', status: 'pending', board: 'Features', author: { name: 'sam_w' }, comments: 1, votes: 7, voted: false }
      ]
    };
  }
}
</script>
</body>
</html>
