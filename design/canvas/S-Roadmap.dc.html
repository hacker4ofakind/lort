<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roadmap loading</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lort/tokens.css">
<link rel="stylesheet" href="ds/lort/components/bundle.css">
<script src="ds/lort/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.rail-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.rail-btn.on{background:var(--surface-2);color:var(--ink)}
.sk{background:var(--surface-2);border-radius:999px;animation:sk-pulse 1.6s ease-in-out infinite}
@keyframes sk-pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.col{border-radius:var(--radius-xl);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--ground-sunken);min-height:760px;box-sizing:border-box;--lt-si-ground:var(--ground-sunken)}
.col .sk{background:var(--surface)}
.skc{display:flex;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.skc .sk{background:var(--surface-2)}
</style>
</helmet>
<div data-theme="dark" aria-busy="true" style="height: 1040px; overflow: hidden; display: flex; background: var(--ground); color: var(--ink); font-family: var(--font-sans)">
  <aside aria-label="Dashboard" style="width: 76px; flex: none; padding: 16px 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--ground-sunken); border-right: 1px solid var(--surface-2)">
    <span style="width: 30px; height: 30px; border-radius: var(--radius-sm); background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; transform: rotate(var(--tilt-mark)); box-shadow: var(--shadow-sticker); margin-bottom: 14px">D</span>
    <span class="rail-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 13h3l3 3h4l3-3h3"></path></svg></span>
    <span class="rail-btn on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6M14 4h6M4 10a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM14 10a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"></path></svg></span>
    <span class="rail-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 6h3a1 1 0 0 1 1 1v11a2 2 0 0 1-4 0V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a3 3 0 0 0 3 3h11M8 8h4M8 12h4M8 16h4"></path></svg></span>
  </aside>
  <main style="flex: 1; min-width: 0; padding: 28px 36px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 22px">
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.025em">Roadmap</h1>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="3">
        <section class="col">
          <div style="display: flex; align-items: center; gap: 8px; padding: 2px 2px 6px">
            <x-import component-from-global-scope="Lort.StatusIcon" status="{{col.s}}" keyline="{{true}}" show-label="{{true}}" size="{{20}}" class-name="title"></x-import>
            <div class="sk" style="width: 26px; height: 20px"></div>
          </div>
          <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="3">
            <div class="skc">
              <div class="sk" style="width: 40px; height: 40px; flex: none"></div>
              <div style="flex: 1; display: flex; flex-direction: column; gap: 9px; padding-top: 3px">
                <div class="sk" style="width: {{c}}; height: 15px"></div>
                <div style="display: flex; gap: 6px"><div class="sk" style="width: 62px; height: 18px"></div><div class="sk" style="width: 44px; height: 18px"></div></div>
              </div>
            </div>
          </sc-for>
        </section>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return { cols: [
      { s: 'planned', cards: ['78%', '62%', '84%', '55%'] },
      { s: 'progress', cards: ['70%', '88%'] },
      { s: 'completed', cards: ['66%', '74%', '58%'] }
    ] };
  }
}
</script>
</body>
</html>
